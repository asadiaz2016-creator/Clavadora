<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e293b">
  <title>Custom Crates &amp; Pallets, Ltd.</title>
  <link rel="stylesheet" href="op.css">
</head>
<body>

  <!-- START SCREEN -->
  <div id="pantallaInicio" class="pantalla activa">
    <div class="inicio-hero">
      <img src="CCP.png" alt="Custom Crates &amp; Pallets" class="hero-logo" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='block'">
      <div id="logoFallback" class="hero-logo-fallback" style="display:none">🔨</div>
      <div class="hero-divider"></div>
      <h1 class="hero-nombre">Custom Crates<br>&amp; Pallets, Ltd.</h1>
      <p class="hero-sub">Production Control</p>
    </div>
    <div class="inicio-body">
      <p id="fechaHoy" class="fecha-hoy"></p>
      <p class="instruccion">Select your shift</p>
      <button class="btn-turno" onclick="seleccionarTurno('Morning')">
        <span class="turno-icon">🌅</span>
        <div class="turno-texto">
          <span class="turno-nombre">Morning Shift</span>
          <span class="turno-hora">6:00 am – 2:30 pm</span>
          <span class="turno-breaks">☕ Lunch 9:30–10:00 · Break 12:00–12:15</span>
        </div>
      </button>
      <button class="btn-turno" onclick="seleccionarTurno('Evening')">
        <span class="turno-icon">🌇</span>
        <div class="turno-texto">
          <span class="turno-nombre">Evening Shift</span>
          <span class="turno-hora">2:30 pm – 10:30 pm</span>
          <span class="turno-breaks">☕ Lunch 6:00–6:30 pm</span>
        </div>
      </button>
      <div id="errorInicio" class="error-msg hidden"></div>
    </div>
  </div>

  <!-- OPERATOR SCREEN -->
  <div id="pantallaOp" class="pantalla">
    <header class="op-header">
      <div class="op-header-left">
        <img src="CCP.png" alt="" class="logo-header" onerror="this.style.display='none'">
        <div>
          <div class="op-turno" id="opTurnoLabel"></div>
          <div class="op-fecha" id="opFechaLabel"></div>
        </div>
      </div>
      <div class="op-total-wrap">
        <span class="op-total-num" id="opTotalNum">0</span>
        <span class="op-total-label">pcs</span>
      </div>
    </header>

    <div class="acciones">
      <button class="btn-accion btn-prod" onclick="abrirModalProd()">
        <span class="accion-icon">➕</span>
        <span>Production</span>
      </button>
      <button class="btn-accion btn-muerto" onclick="abrirModalMuerto()">
        <span class="accion-icon">⏸</span>
        <span>Downtime</span>
      </button>
    </div>

    <div class="resumen-section">
      <div class="resumen-tabs">
        <button class="res-tab activa" onclick="mostrarTab('tabProd', this)">Production</button>
        <button class="res-tab" onclick="mostrarTab('tabMuerto', this)">Downtime</button>
      </div>

      <div id="tabProd" class="res-contenido activa">
        <div id="listaProd" class="lista-registros">
          <div class="empty-state">No records yet</div>
        </div>
      </div>

      <div id="tabMuerto" class="res-contenido">
        <div id="listaMinutos" class="minutos-total hidden">
          ⏱ Total downtime: <strong id="totalMinutos">0</strong> min
        </div>
        <div id="listaMuerto" class="lista-registros">
          <div class="empty-state">No downtime records</div>
        </div>
      </div>
    </div>

    <div class="cerrar-wrap">
      <button class="btn-reporte" onclick="descargarExcel()">📊 Generate Excel Report</button>
      <button class="btn-cerrar" onclick="cerrarTurno()">Close Shift</button>
    </div>
  </div>

  <!-- MODAL: LOG PRODUCTION -->
  <div id="modalProd" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Log Production</h2>
        <button class="btn-close" onclick="cerrarModal('modalProd')">✕</button>
      </div>

      <label class="field-label">Hour</label>
      <select id="pHora" class="field-select"></select>

      <label class="field-label">Pallet Model</label>
      <div id="modeloGrid" class="modelo-grid"></div>
      <button class="btn-link" onclick="mostrarNuevoModelo()">+ Add new model</button>
      <div id="nuevoModeloWrap" class="hidden" style="margin:.5rem 0">
        <div style="display:flex;gap:.5rem">
          <input type="text" id="nuevoModeloInput" class="field-input" placeholder="Ex: 48X40XX" style="text-transform:uppercase;flex:1">
          <button class="btn-sm-add" onclick="agregarModelo()">OK</button>
        </div>
      </div>

      <label class="field-label">Quantity</label>
      <input type="number" id="pCantidad" class="field-input field-big" inputmode="numeric" placeholder="0" min="1">

      <button class="btn-guardar" onclick="guardarProd()">Save</button>
    </div>
  </div>

  <!-- MODAL: DOWNTIME -->
  <div id="modalMuerto" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>⏸ Downtime</h2>
        <button class="btn-close" onclick="cerrarModal('modalMuerto')">✕</button>
      </div>

      <label class="field-label">Reason</label>
      <div class="motivos-grid">
        <button class="btn-motivo" onclick="selMotivo(this)">Maintenance</button>
        <button class="btn-motivo" onclick="selMotivo(this)">Material shortage</button>
        <button class="btn-motivo" onclick="selMotivo(this)">Mechanical failure</button>
        <button class="btn-motivo" onclick="selMotivo(this)">Model change</button>
        <button class="btn-motivo" onclick="selMotivo(this)">Break</button>
        <button class="btn-motivo" onclick="selMotivo(this)">Other</button>
      </div>
      <div id="otroWrap" class="hidden">
        <label class="field-label" style="margin-top:.25rem">What was the reason?</label>
        <input type="text" id="mMotivoCustom" class="field-input" placeholder="Describe the reason...">
      </div>

      <label class="field-label">Total minutes stopped</label>
      <input type="number" id="mMinutos" class="field-input field-big" inputmode="numeric" placeholder="0" min="1">

      <button class="btn-guardar btn-guardar-muerto" onclick="guardarMuerto()">Save</button>
    </div>
  </div>

  <!-- MODAL: REPORT -->
  <div id="modalReporte" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>📋 Shift Report</h2>
        <button class="btn-close" onclick="cerrarModal('modalReporte')">✕</button>
      </div>
      <pre id="reporteTexto" class="reporte-pre"></pre>
      <button class="btn-guardar" onclick="enviarReporte()">📤 Share (WhatsApp / Email)</button>
    </div>
  </div>

  <script src="op.js"></script>
</body>
</html>
